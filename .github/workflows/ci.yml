name: CI

# Gates -> Conventional-Commits version bump -> npm publish.
#
# Required repository secrets:
#   - NPM_TOKEN: npm automation token with publish rights to @ours.network.
#   - VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY: GitHub App credentials
#     used to push the release commit through branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prerelease]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COWORK_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify reviewed dependency installer
        run: node --test .github/scripts/review-sdk-install.test.mjs
      # Cross-repository review gate only. Published dependency qualification
      # remains required before release; no release job uses these artifacts.
      - name: Require same-repository review access
        if: github.event_name == 'pull_request'
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$SAME_REPOSITORY" = true || { echo "::error::Private SDK review requires a same-repository PR; fork secrets are unavailable"; exit 1; }
      - name: Read-only access to reviewed SDK
        if: github.event_name == 'pull_request'
        id: review-sdk-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          owner: adapt-toolkit
          repositories: ours-sdk
          permission-contents: read
      - name: Check out exact reviewed SDK
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: adapt-toolkit/ours-sdk
          ref: 5c757379718958f65f2287f62a5810ce25ecb621
          token: ${{ steps.review-sdk-token.outputs.token }}
          path: .review-sdk
          submodules: recursive
          persist-credentials: false
      - name: Build reviewed SDK and CLI artifacts
        if: github.event_name == 'pull_request'
        working-directory: .review-sdk
        run: |
          test "$(git rev-parse HEAD)" = 5c757379718958f65f2287f62a5810ce25ecb621
          npm ci --no-audit --no-fund
          bash scripts/compile-mufl.sh
          npm run build
          npm run build:cli
          mkdir -p "$RUNNER_TEMP/review-sdk-artifacts"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/review-sdk-artifacts"
          npm pack --workspace @ours.network/cli --ignore-scripts --pack-destination "$RUNNER_TEMP/review-sdk-artifacts"
      - name: Keep dependency checkout outside consumer test discovery
        if: github.event_name == 'pull_request'
        run: mv .review-sdk "$RUNNER_TEMP/review-sdk-source"
      - name: Install and verify reviewed dependency graph
        if: github.event_name == 'pull_request'
        run: >-
          node .github/scripts/review-sdk-install.mjs .
          "$RUNNER_TEMP/review-sdk-artifacts/ours.network-sdk-3.8.0.tgz"
          "$RUNNER_TEMP/review-sdk-artifacts/ours.network-cli-2.8.0.tgz"
          5c757379718958f65f2287f62a5810ce25ecb621
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run build
      - run: test -f dist/daemon.js && test -f dist/cli.js && test -f dist/web/index.html && test -f dist/web/assets/app.js && test -f dist/web/assets/app.css && test "$(find dist/web -type f | wc -l)" -eq 3 && test "$(find docs -maxdepth 1 -name '*.md' | wc -l)" -eq 13
      - run: npm run test:release
      - run: npm test
      - run: npm run test:web
      - run: npm run test:browser
      - run: for i in 1 2 3; do node --test tests/e2e.test.mjs || exit 1; done

  version-bump:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run version bump
        id: bump
        run: bash .github/workflows/scripts/bump-version.sh

  npm-publish:
    needs: [test, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Verify npm artifact
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ needs.version-bump.outputs.version }}"
          npm pack --dry-run --json > /tmp/ours-cowork-pack.json
          node - <<'NODE'
          const pack = require('/tmp/ours-cowork-pack.json')[0];
          const files = new Set(pack.files.map((entry) => entry.path));
          for (const path of [
            'dist/cli.js', 'dist/daemon.js', 'dist/web/index.html',
            'LICENSE', 'README.md',
          ]) {
            if (!files.has(path)) throw new Error(`@ours.network/cowork package is missing ${path}`);
          }
          NODE
      - name: Publish @ours.network/cowork
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Summary
        run: echo "Published @ours.network/cowork@${{ needs.version-bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
