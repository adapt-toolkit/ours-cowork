name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: scripts/compile-mufl.sh
      - run: npm run typecheck
      - run: npm run build
      - run: test -f dist/daemon.js && test -f dist/cli.js && test "$(find dist/mufl_code -name '*.muflo' | wc -l)" -eq 1 && test "$(find docs -maxdepth 1 -name '*.md' | wc -l)" -eq 10
      - run: npm test
      - run: for i in 1 2 3; do node --test tests/e2e.test.mjs || exit 1; done
      - run: npm pack --dry-run
